<mat-toolbar class="app-toolbar">
  <span class="brand">Imladris</span>

  <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="app-nav" mat-stretch-tabs="false">
    @for (route of ROUTES(); track $index) {
      <a mat-tab-link routerLink="/{{ route.path }}" [active]="isActive(route.path)">
        {{ route.title }}
      </a>
    }
  </nav>

  <div class="app-auth">
    @if (authService.isAdmin()) {
      <button mat-icon-button type="button" matTooltip="Cerrar sesión" (click)="logout()">
        <mat-icon>lock_open</mat-icon>
      </button>
    } @else {
      <button mat-icon-button type="button" matTooltip="Iniciar sesión" (click)="openLogin()">
        <mat-icon>lock</mat-icon>
      </button>
    }

    <button
      mat-icon-button
      type="button"
      class="app-menu-toggle"
      [matTooltip]="mobileMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggleMobileMenu()"
    >
      <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>
</mat-toolbar>

@if (mobileMenuOpen()) {
  <nav class="app-mobile-nav">
    @for (route of ROUTES(); track $index) {
      <a
        class="app-mobile-nav__link"
        routerLink="/{{ route.path }}"
        [class.app-mobile-nav__link--active]="isActive(route.path)"
        (click)="closeMobileMenu()"
      >
        {{ route.title }}
      </a>
    }
  </nav>
}

<mat-tab-nav-panel #tabPanel class="app-content">
  <router-outlet></router-outlet>
</mat-tab-nav-panel>
