<section class="home container">
  <header class="page-header home__hero">
    <div class="heading">
      <img src="imladris-logo.png" alt="Imladris" class="home__logo" />
      <p class="kicker">Biblioteca nocturna</p>
    </div>
  </header>

  <div class="home__overview">
    <app-reading-activity [isMobile]="isMobile()" />
    <app-home-stats
      [isMobile]="isMobile()"
      [ready]="ready()"
      [finishedReadings]="finishedReadings()"
      [additions]="additions()"
      [heatmapSummary]="heatmapSummary()"
    />
  </div>

  @if (loading()) {
    <div class="home__state">
      <mat-spinner diameter="36"></mat-spinner>
    </div>
  } @else if (error()) {
    <div class="home__state home__state--error">
      <mat-icon>error_outline</mat-icon>
      <p>{{ error() }}</p>
    </div>
  } @else {
    <div class="home__divider" aria-hidden="true">
      <span class="home__divider-mark"></span>
    </div>

    <div class="home__columns">
      <div class="home__main">
        <app-reading-now
          [readings]="readingNow()"
          [progressByReadingId]="progressByReadingId()"
          [pagesTodayByReadingId]="pagesTodayByReadingId()"
          (readingsChanged)="refreshReadings()"
        />

        <div class="home__divider" aria-hidden="true">
          <span class="home__divider-mark"></span>
        </div>

        <app-last-readings [readings]="finishedReadings()" [limit]="recentCount()" />
      </div>

      <aside class="home__aside">
        <app-last-additions
          [additions]="additions()"
          [finishedReadings]="finishedReadings()"
          [limit]="recentCount()"
        />
      </aside>
    </div>
  }
</section>
