<div class="library-page container">
  <header class="page-header">
    <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="library-page__tabs">
      @for (entry of tabs; track entry.tab) {
        <a mat-tab-link [active]="activeTab() === entry.tab" (click)="onTabChange(entry.tab)">
          <mat-icon>{{ entry.icon }}</mat-icon>
          <span class="library-page__tab-label">{{ entry.label }}</span>
        </a>
      }
    </nav>
    <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>

    @if (authService.isAdmin()) {
      <div class="page-header__actions">
        <button mat-flat-button type="button" color="primary" (click)="onAddClick()">
          <mat-icon>add</mat-icon>
          Añadir
          {{
            activeTab() === LIBRARY_TAB.MANGA
              ? 'tomo'
              : activeTab() === LIBRARY_TAB.FANFIC
                ? 'fanfic'
                : 'libro'
          }}
        </button>
      </div>
    }
  </header>

  @if (activeTab() === LIBRARY_TAB.FANFIC) {
    <app-fanfic-section />
  } @else {
    <app-library-search
      [type]="filters().type"
      [authors]="authors()"
      [series]="series()"
      [editorials]="editorials()"
      [mangas]="mangas()"
      [finishYears]="finishYears()"
      [adquisitionYears]="adquisitionYears()"
      [resultCount]="displayItems().length"
      (filtersChange)="onFiltersChange($event)"
    />

    @if (loading()) {
      <div class="library-page__state">
        <mat-spinner diameter="40" />
        <p>Cargando biblioteca…</p>
      </div>
    } @else if (error()) {
      <div class="library-page__state library-page__state--error">
        <mat-icon>error_outline</mat-icon>
        <p>{{ error() }}</p>
      </div>
    } @else {
      <app-library-data-display
        [mode]="filters().mode"
        [type]="filters().type"
        [data]="displayItems()"
        (viewDetail)="onViewDetail($event)"
        (editItem)="onEditItem($event)"
        (markFinished)="onMarkFinished($event)"
        (deleteItem)="onDeleteItem($event)"
      />
    }
  }
</div>
