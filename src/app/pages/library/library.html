<div class="library-page container">
  <header class="page-header">
    <div class="heading">
      <p class="kicker">Biblioteca nocturna</p>
      <h1>{{ filters().type === TYPE.MANGA ? 'Manga' : 'Novelas' }}</h1>
    </div>

    @if (authService.isAdmin()) {
      <div class="page-header__actions">
        <button mat-flat-button type="button" color="primary" (click)="openCreate()">
          <mat-icon>add</mat-icon>
          Añadir {{ filters().type === TYPE.MANGA ? 'tomo' : 'libro' }}
        </button>
      </div>
    }
  </header>

  <app-library-search
    [authors]="authors()"
    [series]="series()"
    [editorials]="editorials()"
    [mangas]="mangas()"
    [finishYears]="finishYears()"
    [adquisitionYears]="adquisitionYears()"
    [resultCount]="displayItems().length"
    (filtersChange)="onFiltersChange($event)"
  />

  @if (loading()) {
    <div class="library-page__state">
      <mat-spinner diameter="40" />
      <p>Cargando biblioteca…</p>
    </div>
  } @else if (error()) {
    <div class="library-page__state library-page__state--error">
      <mat-icon>error_outline</mat-icon>
      <p>{{ error() }}</p>
    </div>
  } @else {
    <app-library-data-display
      [mode]="filters().mode"
      [type]="filters().type"
      [data]="displayItems()"
      (viewDetail)="onViewDetail($event)"
      (markFinished)="onMarkFinished($event)"
      (deleteItem)="onDeleteItem($event)"
    />
  }
</div>
