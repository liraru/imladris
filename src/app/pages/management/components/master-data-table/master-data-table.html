<div class="master-data-table">
  <div class="master-data-table__toolbar">
    <mat-form-field appearance="outline" class="master-data-table__search">
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        [formControl]="searchCtrl"
        [placeholder]="searchPlaceholder()"
        autocomplete="off"
      />
      @if (searchCtrl.value) {
        <button
          matSuffix
          mat-icon-button
          type="button"
          (click)="searchCtrl.setValue('')"
          aria-label="Limpiar"
        >
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>

    <button mat-flat-button type="button" color="primary" (click)="add.emit()">
      <mat-icon>add</mat-icon>
      {{ addLabel() }}
    </button>
  </div>

  @if (loading()) {
    <div class="master-data-table__state">
      <mat-spinner diameter="36" />
      <p>Cargando…</p>
    </div>
  } @else if (filteredItems().length === 0) {
    <div class="master-data-table__state">
      <mat-icon>inbox</mat-icon>
      <p>{{ emptyMessage() }}</p>
    </div>
  } @else {
    <div class="master-data-table__wrapper">
      <table mat-table [dataSource]="pagedItems()" class="master-data-table__table">
        @for (col of columns(); track col.key) {
          <ng-container [matColumnDef]="col.key">
            <th mat-header-cell *matHeaderCellDef>{{ col.header }}</th>
            <td mat-cell *matCellDef="let item">{{ col.value(item) }}</td>
          </ng-container>
        }

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let item">
            <div class="master-data-table__actions">
              <button
                mat-icon-button
                type="button"
                class="master-data-table__action-btn"
                matTooltip="Editar"
                (click)="edit.emit(item)"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                type="button"
                class="master-data-table__action-btn"
                [disabled]="!canDelete(item)"
                [matTooltip]="canDelete(item) ? 'Eliminar' : 'En uso: no se puede eliminar'"
                (click)="delete.emit(item)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns(); sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
      </table>
    </div>

    <mat-paginator
      class="master-data-table__paginator"
      [length]="filteredItems().length"
      [pageSize]="pageSize"
      [pageIndex]="clampedPageIndex()"
      [hidePageSize]="true"
      [showFirstLastButtons]="true"
      (page)="onPageChange($event)"
    />
  }
</div>
