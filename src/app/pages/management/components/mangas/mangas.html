@if (error()) {
  <p class="mangas__error">{{ error() }}</p>
}

<app-master-data-table
  [columns]="columns"
  [items]="items()"
  [loading]="loading()"
  [isDeletable]="isDeletable"
  addLabel="Añadir manga"
  searchPlaceholder="Buscar manga…"
  emptyMessage="Todavía no hay mangas registrados."
  (add)="openAdd()"
  (edit)="openEdit($event)"
  (delete)="remove($event)"
/>
