<h2 mat-dialog-title>{{ formModeLabels[data.mode] }} ship</h2>

<mat-dialog-content class="ship-form-modal">
  @if (loading()) {
    <div class="ship-form-modal__state">
      <mat-spinner diameter="36" />
      <p>Cargando…</p>
    </div>
  } @else {
    @if (error()) {
      <p class="ship-form-modal__error">{{ error() }}</p>
    }

    <form [formGroup]="form" class="ship-form-modal__form grid">
      <mat-form-field appearance="outline" class="col-12">
        <mat-label>Personajes</mat-label>
        <input
          matInput
          formControlName="characters"
          placeholder="Separados por comas"
          autocomplete="off"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="col-12">
        <mat-label>Fandom</mat-label>
        <mat-select formControlName="fandomId">
          @for (fandom of fandoms(); track fandom.id) {
            <mat-option [value]="fandom.id">{{ fandom.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </form>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button
    mat-flat-button
    type="button"
    color="tertiary"
    [disabled]="saving() || loading()"
    (click)="save()"
  >
    @if (saving()) {
      <mat-spinner diameter="18" />
    } @else {
      <mat-icon>save</mat-icon>
    }
    Guardar
  </button>
</mat-dialog-actions>
