@if (error()) {
  <p class="book-series__error">{{ error() }}</p>
}

<app-master-data-table
  [columns]="columns"
  [items]="items()"
  [loading]="loading()"
  [isDeletable]="isDeletable"
  addLabel="Añadir serie"
  searchPlaceholder="Buscar serie…"
  emptyMessage="Todavía no hay series registradas."
  (add)="openAdd()"
  (edit)="openEdit($event)"
  (delete)="remove($event)"
/>
