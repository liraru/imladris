<h2 mat-dialog-title>{{ formModeLabels[data.mode] }} serie</h2>

<mat-dialog-content class="book-serie-form-modal">
  @if (loading()) {
    <div class="book-serie-form-modal__state">
      <mat-spinner diameter="36" />
      <p>Cargando…</p>
    </div>
  } @else {
    @if (error()) {
      <p class="book-serie-form-modal__error">{{ error() }}</p>
    }

    <form [formGroup]="form" class="book-serie-form-modal__form grid">
      <mat-form-field appearance="outline" class="col-12">
        <mat-label>Título</mat-label>
        <input matInput formControlName="title" autocomplete="off" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="col-12">
        <mat-label>Editorial</mat-label>
        <mat-select formControlName="editorialId">
          @for (editorial of editorials(); track editorial.id) {
            <mat-option [value]="editorial.id">{{ editorial.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </form>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button
    mat-flat-button
    type="button"
    color="tertiary"
    [disabled]="saving() || loading()"
    (click)="save()"
  >
    @if (saving()) {
      <mat-spinner diameter="18" />
    } @else {
      <mat-icon>save</mat-icon>
    }
    Guardar
  </button>
</mat-dialog-actions>
