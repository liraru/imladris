<div class="reading-heatmap">
  @if (showTitle()) {
    <p class="reading-heatmap__title">
      {{ totalPages() | number: '1.0-0' }} páginas leídas {{ rangeLabel() }}
    </p>
  }

  @if (loading()) {
    <div class="reading-heatmap__state">
      <mat-spinner diameter="24"></mat-spinner>
    </div>
  } @else {
    <div class="reading-heatmap__scroll">
      <div class="reading-heatmap__body">
        <div class="reading-heatmap__grid">
          @for (week of weeks(); track $index) {
            <div class="reading-heatmap__week">
              <span class="reading-heatmap__month">{{ monthLabelByWeek()[$index] ?? '' }}</span>
              @for (day of week; track $index) {
                @if (day.empty) {
                  <div class="reading-heatmap__day reading-heatmap__day--empty"></div>
                } @else {
                  <div
                    class="reading-heatmap__day"
                    [attr.data-level]="day.level"
                    [matTooltip]="dayTooltip(day) + '\n' + (day.date | date: 'dd/MM/yyyy')"
                    matTooltipClass="reading-heatmap-tooltip"
                  ></div>
                }
              }
            </div>
          }
        </div>
        <div class="reading-heatmap__legend">
          <span>Menos</span>
          <div class="reading-heatmap__day" data-level="0"></div>
          <div class="reading-heatmap__day" data-level="1"></div>
          <div class="reading-heatmap__day" data-level="2"></div>
          <div class="reading-heatmap__day" data-level="3"></div>
          <div class="reading-heatmap__day" data-level="4"></div>
          <span>Más</span>
        </div>
      </div>
    </div>
  }
</div>
